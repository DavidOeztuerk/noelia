# The demo's single entry point.
#
# Six host names, three stages, two architectures. The same static files are
# served under all of them; only where /api/ and /noelia point differs, which
# is the whole claim the demo makes — one application, and what it runs
# underneath is a decision of the stage.
#
# Upstreams are resolved per request through Docker's embedded DNS rather than
# at startup. With `docker compose --profile dev up` the staging and production
# containers do not exist, and a name nginx insisted on resolving at startup
# would stop the proxy from starting at all instead of answering 502 for the
# stage nobody asked for.
resolver 127.0.0.11 valid=10s ipv6=off;

# Hashless filenames: the browser must not keep yesterday's module. Everything
# else is left alone, and an empty value adds no header at all.
map $uri $demo_cache_control {
    default                "";
    "~*\.(?:js|css|html)$" "no-cache";
}

# --- header ownership -------------------------------------------------------
#
# Exactly one layer sets a given header on a given response.
#
# nginx owns the static files; the application owns /api/ and /noelia, where
# Noelia has already written the headers that response needs. Earlier both
# layers wrote to /api/, which produced two Content-Security-Policy headers —
# browsers intersect those, so the effective policy was whichever pair happened
# to be strictest — and two different Referrer-Policy values.
#
# The four static headers therefore live in `location /` and nowhere else.
# nginx does not inherit add_header into a location that declares its own, so
# the previous arrangement — headers at server level plus a `Cache-Control`
# block for js/css/html — silently dropped all four from every script, every
# stylesheet and from /index.html, while /login kept them. That is why
# Cache-Control is a `map` here and not a second location.

# A host the demo does not serve gets nothing, on either port. Without the TLS
# half of this, a name with no server block of its own — gateway-prod.localhost,
# which composes no dashboard — fell through to the first 8443 block and was
# answered with somebody else's page.
server {
    listen 8080 default_server;
    server_name _;

    return 444;
}

server {
    listen 8443 ssl default_server;
    http2 on;
    server_name _;
    include /etc/nginx/snippets/tls.conf;

    return 444;
}

# --- dev: plain HTTP, no HSTS ----------------------------------------------
#
# Development is the one stage where the dashboard is open and the transport is
# not, and both facts are visible here rather than buried in a predicate.

server {
    listen 8080;
    server_name micro-dev.localhost;
    include /etc/nginx/snippets/static.conf;

    location /api/ {
        set $upstream http://gateway-dev:8080;
        include /etc/nginx/snippets/proxy.conf;
    }

    # Not one service's dashboard. A microservice stack has four, and an
    # address that implies otherwise while showing a quarter of the picture is
    # the kind of small untruth this demo exists to avoid.
    location = /noelia {
        try_files /noelia.html =404;
    }

    # The API description, in Development only — which the application decides,
    # not this block. Staging and Production answer 404 here from the module
    # itself, so routing them would promise a page that does not exist.
    location /api-docs {
        set $upstream http://user-dev:8080;
        include /etc/nginx/snippets/proxy.conf;
    }

    location /swagger {
        set $upstream http://user-dev:8080;
        include /etc/nginx/snippets/proxy.conf;
    }
}

server {
    listen 8080;
    server_name mono-dev.localhost;
    include /etc/nginx/snippets/static.conf;

    location /api/ {
        set $upstream http://mono-dev:8080;
        include /etc/nginx/snippets/proxy.conf;
    }

    location /noelia {
        set $upstream http://mono-dev:8080;
        include /etc/nginx/snippets/proxy.conf;
    }

    # The API description, in Development only — which the application decides,
    # not this block. Staging and Production answer 404 here from the module
    # itself, so routing them would promise a page that does not exist.
    location /api-docs {
        set $upstream http://mono-dev:8080;
        include /etc/nginx/snippets/proxy.conf;
    }

    location /swagger {
        set $upstream http://mono-dev:8080;
        include /etc/nginx/snippets/proxy.conf;
    }
}

# --- staging and production: HTTPS ------------------------------------------
#
# TLS is not decoration here. Two of the findings this stack exists to
# demonstrate cannot be shown over plain HTTP: a Secure cookie is not set on an
# insecure request, and HSTS in a Production posture would make the browser
# rewrite every http:// request and fail. Serving these stages over TLS lets
# both be true and tested instead of excused.

server {
    listen 8080;
    server_name micro-staging.localhost mono-staging.localhost
                micro-prod.localhost mono-prod.localhost
                user-staging.localhost todo-staging.localhost
                user-prod.localhost todo-prod.localhost;

    return 308 https://$host$request_uri;
}

server {
    listen 8443 ssl;
    http2 on;
    server_name micro-staging.localhost;
    include /etc/nginx/snippets/tls.conf;
    include /etc/nginx/snippets/static.conf;

    location /api/ {
        set $upstream http://gateway-staging:8080;
        include /etc/nginx/snippets/proxy.conf;
    }

    # Not one service's dashboard. A microservice stack has four, and an
    # address that implies otherwise while showing a quarter of the picture is
    # the kind of small untruth this demo exists to avoid.
    location = /noelia {
        try_files /noelia.html =404;
    }
}

