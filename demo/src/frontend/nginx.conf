    listen 8443 ssl;
    http2 on;
    server_name mono-staging.localhost;
    include /etc/nginx/snippets/tls.conf;
    include /etc/nginx/snippets/static.conf;

    location /api/ {
        set $upstream http://mono-staging:8080;
        include /etc/nginx/snippets/proxy.conf;
    }

    location /noelia {
        set $upstream http://mono-staging:8080;
        include /etc/nginx/snippets/proxy.conf;
    }
}

server {
    listen 8443 ssl;
    http2 on;
    server_name micro-prod.localhost;
    include /etc/nginx/snippets/tls.conf;
    include /etc/nginx/snippets/static.conf;

    location /api/ {
        set $upstream http://gateway-prod:8080;
        include /etc/nginx/snippets/proxy.conf;
    }

    # Not one service's dashboard. A microservice stack has four, and an
    # address that implies otherwise while showing a quarter of the picture is
    # the kind of small untruth this demo exists to avoid.
    location = /noelia {
        try_files /noelia.html =404;
    }
}

server {
    listen 8443 ssl;
    http2 on;
    server_name mono-prod.localhost;
    include /etc/nginx/snippets/tls.conf;
    include /etc/nginx/snippets/static.conf;

    location /api/ {
        set $upstream http://mono-prod:8080;
        include /etc/nginx/snippets/proxy.conf;
    }

    location /noelia {
        set $upstream http://mono-prod:8080;
        include /etc/nginx/snippets/proxy.conf;
    }
}

# --- one dashboard per service -------------------------------------------

server {
    listen 8080;
    server_name gateway-dev.localhost;

    # One dashboard, and nothing else. This host exists to say which service's
    # dashboard you are looking at; serving the application here too put a
    # second copy of it under a name that routes none of its API calls.
    location = / {
        return 302 /noelia;
    }

    location /noelia {
        set $upstream http://gateway-dev:8080;
        include /etc/nginx/snippets/proxy.conf;
    }
}

