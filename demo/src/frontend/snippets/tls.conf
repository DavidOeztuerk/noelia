# A certificate generated at image build time for the six demo host names.
# Self-signed on purpose: the alternative is a real certificate for names that
# only ever resolve to this machine. The browser warning is the honest signal
# that this is a local demo.
ssl_certificate     /etc/nginx/tls/demo.crt;
ssl_certificate_key /etc/nginx/tls/demo.key;

ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:demo:10m;
ssl_session_timeout 1h;
