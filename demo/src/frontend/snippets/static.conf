# The static half of every host: the files, and the four headers nginx owns.
root /usr/share/nginx/html;
index index.html;

location / {
    # /login serves login.html. A file extension in a shared address says
    # something about how the page is stored, which is nobody's business and
    # cannot survive the storage changing.
    try_files $uri $uri.html $uri/ =404;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control $demo_cache_control always;

    # No upgrade-insecure-requests: the dev stage is served over plain HTTP and
    # the directive would make the browser rewrite every request to https and
    # fail. The staged hosts get it from Noelia on the responses it writes.
    add_header Content-Security-Policy
        "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
        always;
}
