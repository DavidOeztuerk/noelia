# Proxying to an application that writes its own security headers. Nothing is
# added here and nothing is hidden: the response a caller sees is the response
# Noelia wrote, which is the only way the dashboard's own headers and the
# security checks that assert them mean anything.
proxy_pass $upstream;
proxy_http_version 1.1;

proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

# The scheme the *browser* used. Without it the application sees http on every
# request, and a refresh cookie that asks for Secure would be issued without it
# on exactly the stages where it matters.
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
